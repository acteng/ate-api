[project]
name = "ate-api"
version = "1.3.0"
description = "Operational data API for Active Travel England."
requires-python = ">=3.13"
dependencies = [
    "asyncpg~=0.31.0",
    "authlib~=1.6.0",
    "fastapi[standard]~=0.136.0",
    "pydantic-settings~=2.14.0",
    "sqlalchemy[asyncio]~=2.0.0"
]

[project.optional-dependencies]
dev = [
    "black~=26.5.0",
    "httpx[http2]~=0.28.0",
    "isort~=8.0.0",
    "mypy~=2.3.0",
    "pytest~=9.1.0",
    "pytest-asyncio~=1.4.0",
    "respx~=0.23.0",
    "ruff~=0.16.0",
    "testcontainers~=4.15.0"
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"

# black

[tool.black]
line-length = 120
target-version = ["py313"]

# isort

[tool.isort]
profile = "black"
line_length = 120

# mypy

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "authlib.*",
    "testcontainers.postgres.*"
]
ignore_missing_imports = true

# pytest

[tool.pytest.ini_options]
asyncio_mode = "auto"

# ruff

[tool.ruff]
line-length = 120
